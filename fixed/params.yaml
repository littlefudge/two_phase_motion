equations:
  one: "q1*(2*a^2*tau*q2 - mu*(q1-q2)*q1*r)"
  two: "(q1 - q2)*r*(q1^2 - a^2)"
  three: "tau*q2*r*(q1^2 - a^2)"

glob_left: -20
glob_right: 1000
solver:
  meth: "RK45"
  minstep: 1e-8

zero: 1e-6
infty: 1e+3
eps_w: 0.01
delta_blue: 0.01
abserr: "none"
relerr: "none"

const:
  mu: 16
  tau: 1
  a: 1

n_u: 501
n_v: 501
n_r: 3
L_u0: -3
L_u1: 2
L_v0: -5
L_v1: 0
L_r0: -5
L_r1: -4
logr: 1
logu: 1
logv: 1
logall: 0
eps_u: 1.0e-4
eps_r: 0.0001

saveto: "./res"
